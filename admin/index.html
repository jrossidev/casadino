<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel | Casa do Dinossauro</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function(user) {
        var hash = window.location.hash || '';
        var isIdentityHash = /invite_token|confirmation_token|recovery_token|email_change_token|access_token/.test(hash);
        if (!user && isIdentityHash) window.netlifyIdentity.open();
      });
    }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="/admin/preview.js"></script>
</body>
</html>
